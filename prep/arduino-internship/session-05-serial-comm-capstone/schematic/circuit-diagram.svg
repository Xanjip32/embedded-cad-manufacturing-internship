<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="Verdana, sans-serif">
  <rect width="900" height="640" fill="#0f172a"/>
  <text x="450" y="35" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="bold">Session 5 Capstone — Integrated Sensor System</text>

  <!-- Arduino Uno -->
  <rect x="60" y="90" width="220" height="400" rx="10" fill="#0b7a3d" stroke="#064e29" stroke-width="3"/>
  <text x="170" y="118" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">Arduino Uno</text>

  <g fill="#e2e8f0" font-size="13">
    <circle cx="280" cy="160" r="5" fill="#facc15"/><text x="292" y="164">D2 (override switch, INT)</text>
    <circle cx="280" cy="200" r="5" fill="#f87171"/><text x="292" y="204">D8 (status LED)</text>
    <circle cx="280" cy="240" r="5" fill="#4ade80"/><text x="292" y="244">D9 (PWM LED)</text>
    <circle cx="280" cy="280" r="5" fill="#93c5fd"/><text x="292" y="284">A0 (potentiometer)</text>
    <circle cx="280" cy="340" r="5" fill="#fca5a5"/><text x="292" y="344">5V</text>
    <circle cx="280" cy="380" r="5" fill="#94a3b8"/><text x="292" y="384">GND</text>
    <circle cx="280" cy="420" r="5" fill="#c084fc"/><text x="292" y="424">USB -&gt; Serial to PC</text>
  </g>

  <!-- Breadboard -->
  <rect x="470" y="90" width="380" height="400" rx="8" fill="#e5e7eb" stroke="#94a3b8" stroke-width="3"/>
  <text x="660" y="115" text-anchor="middle" font-size="14" fill="#334155">Breadboard</text>
  <line x1="470" y1="130" x2="850" y2="130" stroke="#ef4444" stroke-width="3"/>
  <text x="855" y="134" font-size="11" fill="#ef4444">+ rail</text>
  <line x1="470" y1="145" x2="850" y2="145" stroke="#334155" stroke-width="3"/>
  <text x="855" y="149" font-size="11" fill="#334155">- rail</text>

  <!-- Status LED -->
  <circle cx="530" cy="220" r="18" fill="#ef4444" stroke="#7f1d1d" stroke-width="3"/>
  <text x="530" y="255" text-anchor="middle" font-size="12" fill="#7f1d1d">Status LED</text>
  <rect x="522" y="270" width="16" height="26" fill="#d4a017" stroke="#7c5a00"/>
  <text x="530" y="312" text-anchor="middle" font-size="10" fill="#7c5a00">220Ω</text>

  <!-- PWM LED -->
  <circle cx="610" cy="220" r="18" fill="#4ade80" stroke="#166534" stroke-width="3"/>
  <text x="610" y="255" text-anchor="middle" font-size="12" fill="#166534">PWM LED</text>
  <rect x="602" y="270" width="16" height="26" fill="#d4a017" stroke="#7c5a00"/>
  <text x="610" y="312" text-anchor="middle" font-size="10" fill="#7c5a00">220Ω</text>

  <!-- Potentiometer -->
  <rect x="670" y="205" width="60" height="30" rx="4" fill="#93c5fd" stroke="#1e3a8a" stroke-width="2"/>
  <text x="700" y="225" text-anchor="middle" font-size="10" fill="#1e293b">POT</text>
  <text x="700" y="255" text-anchor="middle" font-size="12" fill="#334155">Potentiometer</text>

  <!-- Switch -->
  <rect x="760" y="205" width="60" height="30" rx="4" fill="#facc15" stroke="#92400e" stroke-width="2"/>
  <text x="790" y="225" text-anchor="middle" font-size="10" fill="#1e293b">SW</text>
  <text x="790" y="255" text-anchor="middle" font-size="12" fill="#334155">Override Switch</text>

  <!-- wires (illustrative) -->
  <path d="M280,200 C380,200 480,220 530,238" stroke="#f87171" stroke-width="2.5" fill="none"/>
  <path d="M280,240 C380,240 490,220 610,238" stroke="#4ade80" stroke-width="2.5" fill="none"/>
  <path d="M280,280 C450,280 620,215 670,215" stroke="#93c5fd" stroke-width="2.5" fill="none"/>
  <path d="M280,160 C420,160 620,205 760,215" stroke="#facc15" stroke-width="2.5" fill="none"/>
  <path d="M280,340 C480,340 650,300 690,235" stroke="#fca5a5" stroke-width="2.5" fill="none" stroke-dasharray="4,3"/>
  <path d="M530,296 C530,350 460,420 280,420" stroke="#334155" stroke-width="2.5" fill="none"/>
  <path d="M610,296 C610,360 460,430 280,420" stroke="#334155" stroke-width="2.5" fill="none"/>
  <path d="M710,235 C710,440 500,440 280,420" stroke="#334155" stroke-width="2.5" fill="none"/>
  <path d="M790,235 C790,450 520,450 280,420" stroke="#334155" stroke-width="2.5" fill="none"/>

  <!-- Legend -->
  <g transform="translate(60,520)" font-size="13" fill="#e2e8f0">
    <text x="0" y="0" font-size="15" font-weight="bold" fill="#f8fafc">Legend</text>
    <line x1="0" y1="18" x2="30" y2="18" stroke="#f87171" stroke-width="3"/><text x="36" y="22">D8 -&gt; Status LED (GPIO)</text>
    <line x1="0" y1="38" x2="30" y2="38" stroke="#4ade80" stroke-width="3"/><text x="36" y="42">D9 -&gt; PWM LED</text>
    <line x1="0" y1="58" x2="30" y2="58" stroke="#93c5fd" stroke-width="3"/><text x="36" y="62">A0 -&gt; Potentiometer wiper (ADC)</text>
    <line x1="0" y1="78" x2="30" y2="78" stroke="#facc15" stroke-width="3"/><text x="36" y="82">D2 -&gt; Override switch (interrupt)</text>
    <line x1="0" y1="98" x2="30" y2="98" stroke="#fca5a5" stroke-width="3" stroke-dasharray="4,3"/><text x="36" y="102">5V -&gt; potentiometer power</text>
    <line x1="0" y1="118" x2="30" y2="118" stroke="#334155" stroke-width="3"/><text x="36" y="122">GND -&gt; shared ground for all parts</text>
  </g>

  <text x="450" y="610" text-anchor="middle" fill="#94a3b8" font-size="12">
    Schematic-style reference, not literal breadboard hole positions — see wiring table in notes.md.
  </text>
</svg>
